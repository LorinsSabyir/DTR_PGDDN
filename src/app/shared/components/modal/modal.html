<!-- TODO bind function onclick (click)="()" -->
<button
  type="button"
  class="btn rounded-full text-body bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm p-2.5 focus:outline-none"
>
  <svg
    class="w-6 h-6 text-gray-800 dark:text-body"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    fill="none"
    viewBox="0 0 24 24"
  >
    <path
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"
    />
  </svg>
</button>

<!-- Main modal -->
<div id="default-modal" [class.hidden]="!isModalOpen" [class.flex]="isModalOpen">
  <div class="relative p-4 w-full max-w-2xl max-h-full">
    <!-- Modal content -->
    <div
      class="bg-white relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6"
    >
      <!-- Modal header -->
      <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">
        <h3 class="text-lg font-medium text-heading">{{ title }}</h3>

        <!-- <app-button [buttonName]="'Add Recipe'" (buttonClicked)="addRecipe()"></app-button> -->

        <!-- TODO bind function onclick (click)="()" -->
        <button
          type="button"
          
          class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
        >
          <svg
            class="w-5 h-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18 17.94 6M18 18 6.06 6"
            />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>

      <!-- Modal body -->
      <div class="bg-inherit">
        <form class="gap-6 mb-6">
          <div>
            <label for="title1" class="block mb-2.5 text-sm font-medium text-heading">Title</label>

            <!-- TODO bind function [(ngModel)] -->
            <input
              type="text1"
              
              name="title1"
              id="title1"
              class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
            />
          </div>
          <div>
            <label for="category1" class="block mb-2.5 text-sm font-medium text-heading"
              >Category</label
            >

            <!-- TODO bind function [(ngModel)] -->
            <input
              type="text"
              
              name="category1"
              id="category1"
              class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
            />
          </div>
        </form>
      </div>

      <!-- Modal footer -->
      <div class="flex items-center border-t border-default space-x-4 pt-4 md:pt-5">

        <!-- TODO bind function onclick (click)="()" -->
        <button
          data-modal-hide="default-modal"
          type="button"
          class="text-body bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
          
        >
          <!-- TODO bind button text -->
        </button>
      </div>

      <div class="flex items-center border-t border-default space-x-4 pt-4 md:pt-5">

        <!-- TODO bind function onclick (click)="()" -->
        <button
          data-modal-hide="default-modal"
          type="button"
          class="text-body bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
          
        >
          <!-- TODO bind button text -->
        </button>
      </div>
      
    </div>
  </div>
</div>
